[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-autotune"
version = "0.1.0"
description = "Control a from-scratch real-time autotune effect with your hands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shazif Ahmed" }]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
realtime = ["sounddevice>=0.4.6", "opencv-python>=4.8", "mediapipe>=0.10"]
dev = ["pytest>=7"]

[project.scripts]
gesture-autotune = "gesture_autotune.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
